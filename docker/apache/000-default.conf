<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted

        # Mauvaise pratique volontaire : le listage de répertoire est activé.
        # Voir Cours OWASP - A05 Security Misconfiguration.
        Options Indexes FollowSymLinks

        # Route toute requête qui ne correspond à aucun fichier existant vers le front
        # controller Symfony (équivalent simplifié du .htaccess habituel du projet).
        FallbackResource /index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
